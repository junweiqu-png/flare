<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Flare 个人导航，搜索并访问常用站点。">
  <title>Flare 导航</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#20263b;background:#f3f5fa;font-size:16px;--surface:#fff;--text:#20263b;--muted:#687089;--line:#e4e8f1;--accent:#465bdb;--soft:#edf0ff;--shadow:0 6px 24px #22305708;color-scheme:light}
    :root[data-theme=dark]{color-scheme:dark;background:#111624;color:#e4e9f8;--surface:#1a2132;--text:#e4e9f8;--muted:#a5afc7;--line:#2b354c;--accent:#a5b3ff;--soft:#283252;--shadow:0 6px 24px #0002}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .shell{max-width:1180px;margin:auto;padding:32px 28px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:52px}.brand{display:flex;align-items:center;gap:12px;font-size:1.15rem;font-weight:700}.brand-mark{width:38px;height:38px;border-radius:12px;background:#475cda;color:#fff;display:grid;place-items:center;font-size:1.4rem}.theme{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:10px 15px;font-size:.9rem}.intro{max-width:740px;margin:0 auto 30px;text-align:center}.eyebrow{color:var(--accent);font-weight:650;font-size:.9rem;margin:0 0 14px}h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.04em;margin:0 0 12px;line-height:1.25}.lead{color:var(--muted);margin:0;font-size:1.05rem;line-height:1.8}.search-wrap{max-width:700px;margin:28px auto 34px;position:relative}.search-icon{position:absolute;left:20px;top:20px;color:var(--muted);pointer-events:none}.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:17px;padding:18px 88px 18px 52px;box-shadow:var(--shadow);min-height:62px}.search::placeholder{color:var(--muted)}.clear{position:absolute;right:14px;top:12px;width:38px;height:38px;border:0;background:var(--soft);color:var(--text);border-radius:10px;font-size:1.3rem}.recovery{max-width:850px;margin:0 auto 28px;padding:14px 18px;background:var(--soft);color:var(--text);border-radius:12px;font-size:.9rem;line-height:1.8}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}.filter{border:1px solid var(--line);border-radius:100px;padding:10px 17px;background:var(--surface);color:var(--muted);font-size:.9rem}.filter[aria-pressed=true]{background:#465bdb;border-color:#465bdb;color:#fff}.filter-count{margin-left:8px;opacity:.8}.results-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;gap:16px}h2{font-size:1.15rem;margin:0}.result-count{font-size:.9rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:flex;gap:16px;align-items:flex-start;text-decoration:none;color:var(--text);padding:23px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:138px;transition:border-color .15s,transform .15s}.card:hover{border-color:var(--accent);transform:translateY(-2px)}.icon{width:46px;height:46px;flex:0 0 46px;border-radius:13px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:.9rem;font-weight:750;overflow:hidden}.card-body{min-width:0}.card-title{font-size:1.05rem;font-weight:650;margin:0 0 7px;overflow-wrap:anywhere}.card-desc{color:var(--muted);font-size:.9rem;margin:0 0 9px;line-height:1.5}.card-host{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}.empty{padding:48px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px;color:var(--muted);line-height:1.9}.empty strong{color:var(--text);display:block;font-size:1.1rem;margin-bottom:6px}footer{margin-top:46px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:.85rem;line-height:1.8}footer a{color:var(--accent)}[hidden]{display:none!important}.noscript{padding:20px;text-align:center}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.shell{padding:22px 18px 30px}.topbar{margin-bottom:38px}.brand{font-size:1rem}.brand-mark{width:34px;height:34px}.theme{padding:9px 12px}.intro{margin-bottom:22px}.lead{font-size:1rem}.search-wrap{margin-top:24px;margin-bottom:24px}.grid{grid-template-columns:1fr;gap:12px}.card{min-height:112px;padding:20px 18px}.filter{padding:9px 14px}.recovery{margin-bottom:22px}.results-top{margin-bottom:16px}.card-desc{margin-bottom:5px}.topbar{gap:12px}footer{margin-top:32px}}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span id="brand-title">Flare 导航</span></div><button type="button" class="theme" id="theme" aria-label="切换深浅主题">切换深浅</button></header>
    <main>
      <div class="intro"><p class="eyebrow">我的常用站点</p><h1>从这里，找到常用的一切。</h1><p class="lead">常用入口放在一起，手机和电脑都能打开。</p></div>
      <div class="search-wrap"><svg class="search-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" class="search" type="search" placeholder="搜索名称、网址或分类" aria-label="搜索导航" autocomplete="off"><button type="button" class="clear" id="clear" aria-label="清空搜索" hidden>×</button></div>
      <div id="recovery" class="recovery" role="note" hidden></div>
      <nav id="filters" class="filters" aria-label="站点分类"></nav>
      <div class="results-top"><h2 id="section-title">全部站点</h2><span id="result-count" class="result-count" role="status" aria-live="polite"></span></div>
      <div id="links" class="grid"></div>
      <div id="empty" class="empty" hidden><strong>没有找到匹配的入口</strong>试试其他关键词，或选择“全部”。</div>
      <noscript><p class="noscript">请启用 JavaScript 以显示导航内容。</p></noscript>
    </main>
    <footer><span>Flare · 每一个常用入口，都有自己的位置。</span><span>网址可随时打开，目标服务仍需在线。</span></footer>
  </div>
  <script id="nav-data" type="application/json">__NAV_DATA__</script>
  <script>
    (() => {
      'use strict';
      const data = JSON.parse(document.getElementById('nav-data').textContent);
      const $ = id => document.getElementById(id);
      document.title = data.title || 'Flare 导航'; $('brand-title').textContent = document.title;
      const storage = { get(key) {try {return localStorage.getItem(key);} catch {return null;}}, set(key,value) {try {localStorage.setItem(key,value);} catch {}} };
      const initialTheme = storage.get('flare-theme');
      document.documentElement.dataset.theme = initialTheme === 'dark' || (!initialTheme && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      $('theme').addEventListener('click',() => {const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme=theme; storage.set('flare-theme',theme);});
      if(data.recovery && !data.recovery.complete && data.recovery.message){$('recovery').textContent=data.recovery.message; $('recovery').hidden=false;}
      let category = null;
      const categories = [...new Set(data.links.map(item => item.category || '未分类'))];
      const buttons = [];
      for(const name of [null, ...categories]) {
        const button=document.createElement('button'); button.type='button'; button.className='filter'; button.setAttribute('aria-pressed',String(name===category));
        button.append(document.createTextNode(name===null?'全部':name));
        const count=document.createElement('span'); count.className='filter-count'; count.textContent=name===null?data.links.length:data.links.filter(item=>(item.category||'未分类')===name).length; button.append(count);
        button.addEventListener('click',()=>{category=name;for(const pair of buttons)pair.button.setAttribute('aria-pressed',String(pair.name===category));render();});
        buttons.push({name,button});$('filters').append(button);
      }
      function render(){
        const query=$('search').value.trim().toLocaleLowerCase(); $('clear').hidden=!query;
        const items=data.links.filter(item=>(category===null || (item.category||'未分类')===category) && [item.name,item.url,item.description,item.category].filter(Boolean).join(' ').toLocaleLowerCase().includes(query));
        const fragment=document.createDocumentFragment();
        for(const item of items){
          const card=document.createElement('a');card.className='card';card.href=item.url;card.target='_blank';card.rel='noopener noreferrer';card.setAttribute('aria-label',item.name+'（新窗口打开）');
          const icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent=item.icon || item.name.slice(0,2).toUpperCase();
          const body=document.createElement('div');body.className='card-body';
          const title=document.createElement('h3');title.className='card-title';title.textContent=item.name;body.append(title);
          if(item.description){const description=document.createElement('p');description.className='card-desc';description.textContent=item.description;body.append(description);}
          const host=document.createElement('span');host.className='card-host';host.textContent=new URL(item.url).host;body.append(host);card.append(icon,body);fragment.append(card);
        }
        $('links').replaceChildren(fragment);$('empty').hidden=items.length>0;$('result-count').textContent=items.length+' 个入口';$('section-title').textContent=category===null?'全部站点':category;
      }
      $('search').addEventListener('input',render);$('clear').addEventListener('click',()=>{$('search').value='';render();$('search').focus();});
      document.addEventListener('keydown',event=>{if(event.key==='/' && !event.ctrlKey && !event.metaKey && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){event.preventDefault();$('search').focus();}if(event.key==='Escape' && document.activeElement===$('search')){$('search').value='';render();}});
      render();
    })();
  </script>
</body>
</html>
