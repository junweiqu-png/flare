<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Flare 个人导航：常用应用、分类书签与快速搜索。">
<title>Flare 导航</title>
<style>
:root{color-scheme:light;font:16px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--bg:#f3f7fc;--surface:#fff;--text:#243752;--muted:#657990;--line:#e0e8f1;--accent:#246bba;--soft:#eaf3ff;--shadow:0 4px 20px #223b6210;background:var(--bg);color:var(--text)}
:root[data-theme=dark]{color-scheme:dark;--bg:#101b2a;--surface:#18273a;--text:#e0ebfa;--muted:#9fb2cd;--line:#2a3e57;--accent:#8bbfff;--soft:#223c59;--shadow:0 4px 20px #0002}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}
.shell{max-width:1280px;margin:auto;padding:30px 30px 24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;display:grid;place-items:center;color:#fff;background:#327ccb;border-radius:13px;font-size:1.55rem}h1{font-size:1.4rem;line-height:1.3;letter-spacing:.01em;margin:0}.subtle{color:var(--muted);font-size:.875rem}.welcome{margin-top:4px}.controls{display:flex;align-items:center;gap:10px}.theme,.plain-button{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:.875rem;min-height:42px}.clock-block{text-align:right;line-height:1.4;margin-right:8px}.clock{font-variant-numeric:tabular-nums;font-size:1.45rem;font-weight:650;letter-spacing:.04em}.date{font-size:.875rem;color:var(--muted)}
.search-wrap{position:relative;margin-bottom:20px}.search{width:100%;min-height:54px;border:1px solid var(--line);border-radius:13px;padding:14px 58px 14px 46px;color:var(--text);background:var(--surface);box-shadow:var(--shadow)}.search::placeholder{color:var(--muted)}.search-icon{position:absolute;top:17px;left:17px;color:var(--muted);pointer-events:none}.clear{position:absolute;right:9px;top:9px;width:36px;height:36px;border:0;border-radius:9px;background:var(--soft);color:var(--text);font-size:1.25rem}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.filter{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);padding:8px 13px;min-height:42px;font-size:.875rem;white-space:nowrap}.filter[aria-pressed=true]{color:#fff;background:#2b70ba;border-color:#2b70ba}.filter-count{margin-left:7px;opacity:.8}
.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}h2{margin:0;font-size:1.1rem;font-weight:700}.count{color:var(--muted);font-size:.875rem}.apps-section{margin-bottom:28px}.apps-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.app-card{display:flex;align-items:center;gap:12px;min-width:0;min-height:88px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:17px 15px;text-decoration:none;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}.app-card:hover{border-color:var(--accent);transform:translateY(-2px)}.app-icon{width:39px;height:39px;display:grid;place-items:center;flex:0 0 39px;border-radius:11px;background:var(--soft);color:var(--accent);font-weight:750;font-size:.875rem}.app-text{min-width:0}.app-name{font-size:.95rem;font-weight:650;overflow-wrap:anywhere;line-height:1.5}.app-scope{font-size:.8rem;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.bookmark-groups{columns:3 285px;column-gap:18px}.group{display:inline-block;vertical-align:top;width:100%;break-inside:avoid;margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.group-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:15px 17px;background:var(--soft)}.group-head h3{margin:0;font-size:1rem;font-weight:700;color:var(--accent)}.bookmark-list{list-style:none;padding:5px 8px;margin:0}.bookmark-item{display:flex;align-items:center;min-width:0}.bookmark{width:100%;min-width:0;display:flex;align-items:center;gap:11px;min-height:48px;padding:11px 9px;border:0;background:transparent;border-radius:8px;text-decoration:none;text-align:left;color:var(--text);font-size:.95rem;line-height:1.55}.bookmark:hover{background:var(--soft);color:var(--accent)}.bookmark-mark{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;border-radius:7px;background:var(--soft);color:var(--accent);font-size:.75rem;font-weight:700}.bookmark-label{overflow-wrap:anywhere;min-width:0}.scope{font-size:.75rem;color:var(--muted);margin-left:auto;white-space:nowrap;padding-left:5px}.private-setting{border:0;background:transparent;color:var(--muted);min-width:40px;min-height:44px;border-radius:8px;font-size:1.1rem}.private-setting:hover{color:var(--accent);background:var(--soft)}.empty{padding:45px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:13px;color:var(--muted)}.empty strong{color:var(--text);display:block;margin-bottom:6px}.result-status{color:var(--muted);font-size:.875rem;margin-bottom:15px}.recovery{background:var(--soft);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:.9rem}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:17px;border-top:1px solid var(--line);font-size:.875rem;color:var(--muted)}footer a{color:var(--accent);text-decoration:none}footer a:hover{text-decoration:underline}.footer-links{display:flex;gap:16px}dialog{max-width:480px;width:calc(100% - 36px);border:1px solid var(--line);border-radius:17px;padding:25px;background:var(--surface);color:var(--text);box-shadow:0 18px 80px #0003}dialog::backdrop{background:#08152888}dialog h2{font-size:1.2rem}dialog p{font-size:.9rem;color:var(--muted);margin:12px 0 18px}dialog label{display:block;margin-bottom:7px;font-size:.9rem}dialog input{width:100%;padding:11px 12px;min-height:46px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.primary{background:#2b70ba;color:#fff;border:1px solid #2b70ba;border-radius:10px;padding:10px 15px}.error{color:#c94444!important;font-size:.875rem;margin:9px 0 0!important}.notice{min-height:24px;font-size:.875rem;color:var(--accent);margin-top:10px}
@media(max-width:1080px){.apps-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.shell{padding:20px 15px}.topbar{align-items:flex-start;margin-bottom:18px}.brand{gap:9px}.brand-mark{width:34px;height:34px;border-radius:10px}h1{font-size:1.18rem}.controls{align-items:flex-end;flex-direction:column;gap:6px}.clock-block{margin:0}.clock{font-size:1.15rem}.date{font-size:.8rem}.theme{padding:6px 10px;min-height:34px;font-size:.8rem}.welcome{font-size:.8rem}.apps-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.app-card{min-height:78px;padding:13px 11px;gap:10px}.app-icon{width:34px;height:34px;flex-basis:34px}.app-name{font-size:.9rem}.filters{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 10px;margin-bottom:16px;scrollbar-width:thin}.bookmark-groups{columns:1}.bookmark{min-height:49px}.section-head{margin-bottom:11px}.group{margin-bottom:13px}.app-scope{font-size:.75rem}footer{font-size:.8rem}.bookmark-mark{font-size:.75rem}}@media(prefers-reduced-motion:reduce){.app-card{transition:none}.app-card:hover{transform:none}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><div><h1 id="brand-title">Flare 导航</h1><div class="subtle welcome" id="greeting"></div></div></div><div class="controls"><div class="clock-block" id="date-time"><div class="clock" id="clock"></div><div class="date" id="date"></div></div><button type="button" class="theme" id="theme" aria-label="切换深浅主题">切换深浅</button></div></header>
<main>
<div class="search-wrap"><svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" class="search" type="search" placeholder="搜索应用、书签、网址或分类" aria-label="搜索导航" autocomplete="off"><button type="button" class="clear" id="clear" aria-label="清空搜索" hidden>×</button></div>
<div id="recovery" class="recovery" role="note" hidden></div>
<nav id="filters" class="filters" aria-label="站点分类"></nav>
<div id="result-status" class="result-status" role="status" aria-live="polite"></div>
<section class="apps-section" id="apps-section" aria-labelledby="apps-title"><div class="section-head"><h2 id="apps-title">常用应用</h2><span class="count" id="apps-count"></span></div><div class="apps-grid" id="apps"></div></section>
<section id="bookmarks-section" aria-labelledby="bookmarks-title"><div class="section-head"><h2 id="bookmarks-title">分类书签</h2><span class="count" id="bookmarks-count"></span></div><div id="bookmarks" class="bookmark-groups"></div></section>
<div class="empty" id="empty" hidden><strong>没有找到匹配的入口</strong>试试其他关键词，或切换到“全部”。</div>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<noscript><p>请启用 JavaScript 以显示导航内容。</p></noscript>
</main>
<footer><span id="footer-count"></span><div class="footer-links"><a href="https://github.com/soulteary/docker-flare" target="_blank" rel="noopener noreferrer">Flare</a><a href="https://github.com/junweiqu-png/flare" target="_blank" rel="noopener noreferrer">源代码</a></div></footer>
</div>
<dialog id="private-dialog" aria-labelledby="private-title"><form id="private-form"><h2 id="private-title">设置私密链接</h2><p>地址只保存在这个浏览器，不上传到 GitHub。其他设备需要分别设置。</p><label for="private-url">完整地址</label><input id="private-url" type="url" placeholder="粘贴原来的完整地址" autocomplete="off" required><p class="error" id="private-error" role="alert" hidden></p><div class="dialog-actions"><button class="plain-button" type="button" id="private-cancel">取消</button><button class="primary" type="submit">保存到本机</button></div></form></dialog>
<script id="nav-data" type="application/json">__NAV_DATA__</script>
<script>
(() => {
'use strict';
const data=JSON.parse(document.getElementById('nav-data').textContent);
const $=id=>document.getElementById(id);
const settings=data.settings||{};
document.title=data.title||'Flare 导航';$('brand-title').textContent=document.title;
const storage={get(key){try{return localStorage.getItem(key);}catch{return null;}},set(key,value){try{localStorage.setItem(key,value);return true;}catch{return false;}}};
document.documentElement.dataset.theme=storage.get('flare-theme')||'light';
$('theme').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;storage.set('flare-theme',next);});
const clockFormatter=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const dateFormatter=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',weekday:'long'});
function tick(){const now=new Date();$('clock').textContent=clockFormatter.format(now);$('date').textContent=dateFormatter.format(now);const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',hourCycle:'h23'}).format(now));const greetings=settings.greetings||['早上好','中午好','下午好','晚上好'];$('greeting').textContent=greetings[hour<11?0:hour<14?1:hour<18?2:3]||'你好';}
tick();if(settings.showDateTime===false)$('date-time').hidden=true;else setInterval(tick,1000);
if(data.recovery&&!data.recovery.complete&&data.recovery.message){$('recovery').textContent=data.recovery.message;$('recovery').hidden=false;}
const allApps=data.links.filter(item=>item.kind==='apps');
const allBookmarks=data.links.filter(item=>item.kind!=='apps');
const categories=data.categories?.map(item=>item.title)||[...new Set(allBookmarks.map(item=>item.category||'未分类'))];
$('footer-count').textContent=allApps.length+' 个应用 · '+allBookmarks.length+' 个书签 · '+categories.length+' 个分类';
let category=null;let currentPrivate=null;const buttons=[];
for(const name of [null,'常用应用',...categories]){const button=document.createElement('button');button.type='button';button.className='filter';button.setAttribute('aria-pressed',String(name===category));button.append(document.createTextNode(name===null?'全部':name));const count=document.createElement('span');count.className='filter-count';count.textContent=name===null?data.links.length:name==='常用应用'?allApps.length:allBookmarks.filter(item=>(item.category||'未分类')===name).length;button.append(count);button.addEventListener('click',()=>{category=name;for(const pair of buttons)pair.button.setAttribute('aria-pressed',String(pair.name===category));render();});buttons.push({name,button});$('filters').append(button);}
function scope(item){if(item.private)return '私密';const host=new URL(item.url).hostname;if(host==='localhost'||host==='127.0.0.1'||host==='[::1]')return '本机';if(/^192\.168\.|^10\.|^172\.(1[6-9]|2\d|3[01])\./.test(host))return '内网';return '';}
function icon(item){if(/路由|蒲公英/.test(item.name))return '路';if(/Bitwarden/i.test(item.name))return 'BW';if(/PiKVM/i.test(item.name))return 'KVM';if(/DS213|NAS/i.test(item.name))return 'NAS';if(/AList/i.test(item.name))return 'AL';if(/Flare/i.test(item.name))return 'F';if(/DDNS/i.test(item.name))return 'DNS';return item.name.replace(/[^A-Za-z\u3400-\u9fff]/g,'').slice(0,1).toUpperCase()||'·';}
function destination(element,item){element.href=item.url;const newTab=item.kind==='apps'?settings.openAppNewTab!==false:settings.openBookmarkNewTab!==false;if(newTab){element.target='_blank';element.rel='noopener noreferrer';}element.setAttribute('aria-label',item.name+(newTab?'（新窗口打开）':''));element.title=item.description||item.name;}
function validLocal(value){try{const u=new URL(value);return /^https?:$/.test(u.protocol)&&!!u.hostname&&!/[\u0000-\u001f]/.test(value);}catch{return false;}}
function configure(item){currentPrivate=item;$('private-title').textContent='设置 '+item.name+' 的私密链接';$('private-url').value='';$('private-error').hidden=true;$('private-dialog').showModal();$('private-url').focus();}
function privateClick(item){const address=storage.get('flare-'+item.private_id);if(address&&validLocal(address))window.open(address,'_blank','noopener,noreferrer');else configure(item);}
$('private-cancel').addEventListener('click',()=>$('private-dialog').close());
$('private-form').addEventListener('submit',event=>{event.preventDefault();if(!currentPrivate)return;const value=$('private-url').value.trim();if(!validLocal(value)){$('private-error').textContent='请输入有效的 HTTP 或 HTTPS 地址。';$('private-error').hidden=false;return;}if(!storage.set('flare-'+currentPrivate.private_id,value)){$('private-error').textContent='浏览器不允许本地保存，请检查浏览器的存储设置。';$('private-error').hidden=false;return;}$('private-dialog').close();$('private-url').value='';$('notice').textContent='私密地址已保存在这个浏览器。';render();});
function render(){
 const query=$('search').value.trim().toLocaleLowerCase();$('clear').hidden=!query;
 const match=item=>[item.name,item.url,item.display_host,item.description,item.category].filter(Boolean).join(' ').toLocaleLowerCase().includes(query);
 const apps=(category===null||category==='常用应用')?allApps.filter(match):[];
 const bookmarks=category==='常用应用'?[]:allBookmarks.filter(item=>(category===null||(item.category||'未分类')===category)&&match(item));
 const appFragment=document.createDocumentFragment();
 for(const item of apps){const card=document.createElement(item.private?'button':'a');card.className='app-card';if(item.private){card.type='button';card.addEventListener('click',()=>privateClick(item));}else destination(card,item);const mark=document.createElement('span');mark.className='app-icon';mark.setAttribute('aria-hidden','true');mark.textContent=icon(item);const text=document.createElement('div');text.className='app-text';const name=document.createElement('div');name.className='app-name';name.textContent=item.name;text.append(name);const extra=document.createElement('div');extra.className='app-scope';extra.textContent=scope(item)||new URL(item.url).hostname;text.append(extra);card.append(mark,text);appFragment.append(card);}
 $('apps').replaceChildren(appFragment);$('apps-count').textContent=apps.length+' 个';$('apps-section').hidden=!apps.length;
 const groups=document.createDocumentFragment();
 for(const name of categories){const items=bookmarks.filter(item=>(item.category||'未分类')===name);if(!items.length)continue;const section=document.createElement('section');section.className='group';section.setAttribute('aria-label',name);const head=document.createElement('div');head.className='group-head';const title=document.createElement('h3');title.textContent=name;const count=document.createElement('span');count.className='count';count.textContent=items.length;head.append(title,count);const list=document.createElement('ul');list.className='bookmark-list';
  for(const item of items){const row=document.createElement('li');row.className='bookmark-item';const link=document.createElement(item.private?'button':'a');link.className='bookmark';if(item.private){link.type='button';link.setAttribute('aria-label',item.name+'（私密链接）');link.addEventListener('click',()=>privateClick(item));}else destination(link,item);const mark=document.createElement('span');mark.className='bookmark-mark';mark.setAttribute('aria-hidden','true');mark.textContent=icon(item);const label=document.createElement('span');label.className='bookmark-label';label.textContent=item.name;link.append(mark,label);const hint=scope(item);if(hint){const tag=document.createElement('span');tag.className='scope';tag.textContent=item.private?(storage.get('flare-'+item.private_id)?'私密':'本机设置'):hint;link.append(tag);}row.append(link);if(item.private){const setup=document.createElement('button');setup.type='button';setup.className='private-setting';setup.textContent='⚙';setup.setAttribute('aria-label','设置 '+item.name+' 的私密地址');setup.addEventListener('click',()=>configure(item));row.append(setup);}list.append(row);}
  section.append(head,list);groups.append(section);
 }
 $('bookmarks').replaceChildren(groups);$('bookmarks-count').textContent=bookmarks.length+' 个';$('bookmarks-section').hidden=!bookmarks.length;$('empty').hidden=apps.length+bookmarks.length>0;$('result-status').textContent=query?'找到 '+(apps.length+bookmarks.length)+' 个匹配入口':'';$('result-status').hidden=!query;
}
$('search').addEventListener('input',render);$('clear').addEventListener('click',()=>{$('search').value='';render();$('search').focus();});
document.addEventListener('keydown',event=>{if(event.key==='/'&&!event.ctrlKey&&!event.metaKey&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){event.preventDefault();$('search').focus();}if(event.key==='Escape'&&document.activeElement===$('search')){$('search').value='';render();}});
render();
})();
</script>
</body>
</html>
